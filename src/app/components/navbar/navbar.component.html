<div class="navbar">
    <nav class="navbar-start">
        <ul class="menu">
            @for (navLink of navLinks(); track navLink.id) {
                <li>
                    <a
                        [routerLink]="navLink.url"
                        routerLinkActive="active"
                        [routerLinkActiveOptions]="{ exact: navLink.url === '/' }"
                    >
                        {{ navLink.label }}
                    </a>
                </li>
            }
        </ul>
    </nav>

    <div class="navbar-center">
        <a class="logo-link" [routerLink]="'/'">
            <img src="assets/images/logo.svg" alt="Logo" class="logo-image" fetchpriority="high" width="100%" height="100%" />
        </a>
    </div>

    <div class="navbar-end">
        <ul class="menu">
            @for (socialLink of socialLinks(); track socialLink.id) {
                <li>
                    <a [href]="socialLink.url" target="_blank" rel="noopener noreferrer" [title]="socialLink.label">
                        <ng-icon [name]="socialLink.icon"></ng-icon>
                    </a>
                </li>
            }
        </ul>
    </div>
</div>
