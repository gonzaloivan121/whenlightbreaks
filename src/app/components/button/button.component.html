@let isIconStart = icon() && iconPosition() === 'start';
@let isIconEnd = icon() && iconPosition() === 'end';

<button type="button" [class]="buttonClass()" [class.disabled]="disabled()" [disabled]="disabled()" (click)="onClick.emit()">
    @if (isIconStart) {
        <ng-content select="ng-icon"></ng-content>
    }

    <span [class.icon-start]="isIconStart" [class.icon-end]="isIconEnd">{{ label() }}</span>

    @if (isIconEnd) {
        <ng-content select="ng-icon"></ng-content>
    }
</button>
