<div class="to-top" [class.show-scrollTop]="windowScrolled()">
    <button-component
        label="Top"
        variant="light"
        size="small"
        [rounded]="true"
        [icon]="true"
        (onClick)="scrollToTop()"
    >
        <ng-icon name="ionArrowUp"></ng-icon>
    </button-component>
</div>
