<main class="showcase-shell" aria-labelledby="showcase-shell-title">
	<header class="shell-header">
		<h1 id="showcase-shell-title">Component Showcase</h1>
		<p>Select a component to preview states and copy usage snippets.</p>

		<nav class="showcase-nav" aria-label="Showcase components">
			@for (item of navItems; track item.id) {
				<a class="nav-link" [routerLink]="item.path" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
					<span class="nav-link-label">{{ item.label }}</span>
					<span class="nav-link-description">{{ item.description }}</span>
				</a>
			}
		</nav>
	</header>

	<section class="showcase-view" aria-label="Selected component showcase">
		<router-outlet></router-outlet>
	</section>
</main>
