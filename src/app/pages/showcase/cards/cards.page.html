<main class="cards-showcase" aria-labelledby="cards-showcase-title">
    <header class="showcase-header">
        <h1 id="cards-showcase-title">Card Showcase</h1>
        <p>Preview complete cards with header, body, and footer sections. Total examples: {{ totalCards }}.</p>
    </header>

    <section class="cards-grid" role="list" aria-label="Card showcase examples">
        @for (example of examples; track example.id) {
            <article class="example-card" role="listitem">
                <h2>{{ example.title }}</h2>

                <card-component
                    [rounded]="example.rounded"
                    [elevated]="example.elevated">
                    <card-header-component>
                        <h3>{{ example.header }}</h3>
                    </card-header-component>

                    @if (example.bodyImage) {
                        <card-body-component
                            [imageSrc]="example.bodyImage.src"
                            [imageAlt]="example.bodyImage.alt"
                            [imageWidth]="example.bodyImage.width"
                            [imageHeight]="example.bodyImage.height"></card-body-component>
                    } @else {
                        <card-body-component>
                            <p>{{ example.body }}</p>
                        </card-body-component>
                    }

                    <card-footer-component>
                        <p>{{ example.footer }}</p>
                    </card-footer-component>
                </card-component>

                <button
                    type="button"
                    class="copy-trigger"
                    [class.copied]="isCopied(example.id)"
                    (click)="copyCardCode(example)"
                    [attr.aria-label]="'Copy code for ' + example.title">
                    @if (isCopied(example.id)) {
                        Copied
                    } @else {
                        Copy code
                    }
                </button>
            </article>
        }
    </section>
</main>
