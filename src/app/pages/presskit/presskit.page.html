<main class="presskit-page" aria-label="Press Kit page">
    <hero-component
        backgroundType="video"
        [overlay]="false"
        [fullScreen]="true"
        videoSrc="assets/videos/hero.mp4"
        videoPoster="assets/images/hero.webp"
    >
        <hero-content-component
            title="Press Kit"
            description="Everything you need to cover When Light Breaks. Download high-res photos, official branding, and complete biographical details detailing the band's cross-continental journey and debut release, 'Pre-Human State'."
        >
            <button-component
                label="Download Press Kit"
                variant="dark"
                [icon]="true"
                title="Download Press Kit"
                (click)="DownloadPressKit()"
            >
                <ng-icon name="ionDownload" />
            </button-component>
        </hero-content-component>
    </hero-component>
</main>
