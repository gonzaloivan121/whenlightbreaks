@let products = productsSignal() ?? [];

<container-component size="large">
    <title-component [title]="title()" color="primary" size="large" [centered]="true"></title-component>

    @if (products.length > 0) {
        <div class="store">
            @for (product of products; track product.id) {
                <product-component [product]="product"></product-component>
            }
        </div>
    } @else {
        <div class="no-products">No products available.</div>
    }
</container-component>
