<container-component size="large">
    <title-component [title]="title()" color="primary" size="large" [centered]="true"></title-component>

    <div class="highlight">
        <a href="#">
            <img class="highlight-image" src="assets/images/albums/pre-human-state.webp" alt="Pre-Human State" />
        </a>

        <div class="highlight-content">
            <div class="highlight-block">
                <h2 class="highlight-title">Listen Now</h2>
                <button-component label="Choose Platform" variant="light"></button-component>
            </div>

            <div class="highlight-block">
                <h2 class="highlight-title">Merch</h2>
                <button-component label="Store" variant="light"></button-component>
            </div>
        </div>
    </div>

</container-component>
