<container-component size="large">
    <title-component [title]="title()" color="primary" size="large" [centered]="true"></title-component>

    @if (hasSongs() && songs().length > 0) {
        <div class="music">
            @for (song of songs(); track song.id) {
                <song-component [song]="song"></song-component>
            }
        </div>
    }
</container-component>
